name: Daily digest

on:
  # Cron is always UTC. Two entries + the guard step below give you 09:00
  # Amsterdam time all year, through both DST changes.
  schedule:
    - cron: "0 7 * * *"   # 09:00 CEST (summer)
    - cron: "0 8 * * *"   # 09:00 CET  (winter)
  workflow_dispatch:       # manual "Run workflow" button in the Actions tab

permissions:
  contents: write          # required to commit index.html back to the repo

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Is it 09:00 in Amsterdam?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "run=yes" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Amsterdam date +%H)" = "09" ]; then
            echo "Local time is 09:xx — proceeding."
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Local time is $(TZ=Europe/Amsterdam date +%H):xx — this is the"
            echo "other DST cron firing. Skipping so the digest runs once a day."
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes'
        run: pip install -r requirements.txt

      - name: Collect articles
        if: steps.gate.outputs.run == 'yes'
        env:
          INGEST_DAYS: "1"    # only add articles published today
          WINDOW_DAYS: "7"    # keep them on the page for 7 days
          FETCH_PAGES: "1"
          PAGE_LIMIT: "120"
        run: python scripts/collect.py

      - name: Render digest
        if: steps.gate.outputs.run == 'yes'
        run: python scripts/render.py

      - name: Commit and push
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/articles.json
          if git diff --cached --quiet; then
            echo "Nothing changed today — no commit."
            exit 0
          fi
          git commit -m "Daily digest $(TZ=Europe/Amsterdam date +%F)"
          git push

      - name: Upload digest as artifact
        if: steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: |
            index.html
            data/articles.json
          retention-days: 14
